
name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile C++
        run: g++ tiket.cpp -o tiket.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tiket-exe
          path: tiket.exe
